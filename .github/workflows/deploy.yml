name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build
        run: pnpm build
        env:
          PUBLIC_SITE_URL: https://kawaikara.faby.day
      - name: Retain assets for cached pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/retain-pages-assets.py dist
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?status=success&branch=main&per_page=2" --jq '.workflow_runs[].id')
          for run in $runs; do
            previous="$RUNNER_TEMP/pages-$run"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name github-pages --dir "$previous"; then
              python3 scripts/retain-pages-assets.py dist --archive "$previous/artifact.tar"
            else
              echo "::warning::Previous Pages artifact $run is unavailable; skipping asset retention."
            fi
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
